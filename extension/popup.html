<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 280px;
            padding: 14px;
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #d0d0d0;
            margin: 0;
        }
        h3 {
            color: #00ff88;
            margin: 0 0 4px;
            font-size: 1em;
            font-weight: 500;
        }
        p {
            font-size: 0.8em;
            color: #8899aa;
            margin: 0 0 12px;
            line-height: 1.4;
        }
        button {
            width: 100%;
            background: #00ff88;
            color: #0a0a0f;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        button:hover { background: #00cc66; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.secondary {
            background: #2a2a4a;
            color: #aabbcc;
        }
        button.secondary:hover { background: #3a3a5a; }
        #status {
            margin-top: 10px;
            font-size: 0.82em;
            color: #88ccff;
            min-height: 1.2em;
            line-height: 1.4;
        }
        .error { color: #ff6677 !important; }
        .success { color: #00ff88 !important; }
        .hint {
            font-size: 0.75em;
            color: #556677;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #2a2a4a;
        }
    </style>
</head>
<body>
    <h3>🎵 VK Tracklist Export</h3>
    <p>Extract the track list of the VK playlist open in this tab.</p>

    <button id="exportCurrentBtn">📋 Export current playlist</button>
    <button id="copyCurrentBtn" class="secondary">📄 Copy to clipboard</button>

    <div id="status"></div>

    <div class="hint">
        Web app running? You can also paste a playlist URL into Revseeker
        and let it fetch the track list automatically.
    </div>

    <script src="popup.js"></script>
</body>
</html>
